<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GIOVABATA">
<title>GIOVABATA</title>
<style>
:root{
  --font: Inter, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg:#08080d; --panel:#13131c; --panel2:#1b1b27; --line:#2a2a3b; --text:#f4f4f8; --muted:#9b9bb2;
  --warn:#ffb400;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
svg.i{width:1em;height:1em;fill:currentColor;flex:none;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.scroll{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.muted{color:var(--muted);font-size:13px}

/* ---------- HOME ---------- */
.home-bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.home-bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:float 18s ease-in-out infinite alternate}
.home-bg i:nth-child(1){background:#ff3d2e;top:-22vmax;left:-18vmax}
.home-bg i:nth-child(2){background:#0094ff;bottom:-26vmax;right:-18vmax;animation-delay:-6s}
.home-bg i:nth-child(3){background:#ffb400;top:35%;left:38%;width:34vmax;height:34vmax;opacity:.12;animation-delay:-12s}
@keyframes float{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.wrap{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px)}
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.brand{min-width:0}
.logo-big svg{width:min(600px,74vw);height:auto;display:block;filter:drop-shadow(0 10px 30px rgba(255,61,46,.25))}
.tag{letter-spacing:.42em;color:var(--muted);font-weight:900;font-size:clamp(10px,2.4vw,14px);margin:8px 0 0 4px}
.icon-btn{width:52px;height:52px;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:26px;flex:none}
.icon-btn:active{transform:scale(.94)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;margin-top:24px}
.card{position:relative;background:linear-gradient(180deg,rgba(32,32,46,.92),rgba(19,19,28,.92));border:1px solid var(--line);border-radius:26px;padding:22px 20px 20px;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.card.s1{--c1:#ff3d2e;--c2:#ffa01a}
.card.s2{--c1:#00a6ff;--c2:#7a5cff}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card h2{font-size:clamp(24px,6vw,32px);font-weight:900;letter-spacing:.02em}
.dur{font-size:clamp(32px,8vw,46px);font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.dur-l{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:900;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 14px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:clamp(17px,4.6vw,22px);font-weight:900;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:900;margin-top:2px}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;min-height:28px;align-items:center}
.chip{font-size:11px;font-weight:900;letter-spacing:.05em;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-transform:uppercase}
.btn-row{display:flex;gap:10px}
.btn{min-height:58px;border-radius:18px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:900;letter-spacing:.08em;font-size:17px}
.btn:active{transform:scale(.97)}
.btn .i{font-size:24px}
.btn-primary{flex:1;background:linear-gradient(90deg,var(--c1,#ff3d2e),var(--c2,#ffa01a));color:#fff;box-shadow:0 12px 34px -12px var(--c1,#ff3d2e)}
.btn-ghost{background:var(--panel);border:1px solid var(--line)}
.btn-danger{background:#ff2d55;color:#fff}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
.foot.warn{color:var(--warn);font-weight:800}

/* ---------- PAGINE IMPOSTAZIONI ---------- */
.page-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px) 10px calc(env(safe-area-inset-left) + 16px);background:rgba(8,8,13,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.page-head h1{font-size:20px;font-weight:900;letter-spacing:.08em;flex:1;min-width:0}
.page{max-width:960px;margin:0 auto;padding:6px calc(env(safe-area-inset-right) + 16px) 24px calc(env(safe-area-inset-left) + 16px)}
.sec-title{font-size:12px;letter-spacing:.22em;color:var(--muted);font-weight:900;margin:22px 4px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.field{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px}
.field .lbl{flex:1;min-width:0}
.field .lbl b{display:block;font-weight:900;letter-spacing:.03em;font-size:clamp(13px,3.6vw,15px);overflow-wrap:anywhere}
@media (max-width:380px){ .field{padding-left:12px;gap:6px} .num{width:66px} .step{width:46px} }
.field .lbl small{color:var(--muted);font-size:12px}
.step{width:50px;height:50px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);font-size:28px;font-weight:900;display:grid;place-items:center;flex:none}
.step:active{transform:scale(.92);background:#2a2a3d}
.num{width:78px;height:50px;border-radius:15px;background:#0b0b12;border:1px solid var(--line);color:var(--text);font:inherit;font-size:24px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{display:block;width:100%;min-height:260px;background:var(--panel);border:1px solid var(--line);border-radius:18px;color:var(--text);font:inherit;font-size:18px;font-weight:800;line-height:1.65;padding:14px 16px;text-transform:uppercase;resize:vertical;outline:none}
textarea:focus,.num:focus,select:focus{border-color:#ff7a1a;outline:none}
textarea::placeholder{color:#55556a}
.hint{font-size:13px;color:var(--muted);margin:8px 4px;line-height:1.4}
.hint.warn{color:var(--warn)}
.hint.ok{color:#3ee08a}
.bottom-bar{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:12px;padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);background:rgba(8,8,13,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bottom-bar .tot{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.14em}
.bottom-bar .tot b{display:block;color:var(--text);font-size:26px;letter-spacing:0;font-variant-numeric:tabular-nums}
.bottom-bar .btn{max-width:340px;margin-left:auto}
.srow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;flex-wrap:wrap}
.srow .lbl{flex:1 1 150px;font-weight:900;letter-spacing:.04em;font-size:15px}
select{flex:1 1 170px;height:50px;border-radius:15px;background:#0b0b12;border:1px solid var(--line);color:var(--text);font:inherit;font-size:16px;font-weight:800;padding:0 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9b9bb2 50%),linear-gradient(135deg,#9b9bb2 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
.vol{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.vol b{font-weight:900;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:#ff5a1f;height:30px}
.stack{display:flex;flex-direction:column;gap:10px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.5;color:#cfcfe0}
.note b{color:var(--text)}

/* ---------- ALLENAMENTO ---------- */
#s-workout{--p1:#ff2d2d;--fg:#fff;--glass:rgba(0,0,0,.16);--glassb:rgba(255,255,255,.30);color:var(--fg);-webkit-user-select:none;user-select:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden}
#s-workout[data-phase=prep]{--p1:#ffc800;--fg:#141414;--glass:rgba(0,0,0,.09);--glassb:rgba(0,0,0,.22)}
#s-workout[data-phase=work]{--p1:#ff3120;--fg:#fff}
#s-workout[data-phase=rest]{--p1:#14d96b;--fg:#04240f;--glass:rgba(0,0,0,.09);--glassb:rgba(0,0,0,.22)}
#s-workout[data-phase=recovery]{--p1:#2a62ff;--fg:#fff}
.w-bg{position:absolute;inset:0;z-index:0;background-color:var(--p1);transition:background-color .35s ease,filter .35s ease;overflow:hidden}
.w-bg::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 15% 0%,rgba(255,255,255,.30),transparent 60%),linear-gradient(170deg,transparent 40%,rgba(0,0,0,.28))}
.w-bg::after{content:"";position:absolute;top:-10%;bottom:-10%;left:-200px;right:-200px;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 60px,transparent 60px 120px);animation:stripes 5s linear infinite}
@keyframes stripes{to{transform:translateX(132.4px)}}
#s-workout.paused .w-bg{filter:saturate(.35) brightness(.78)}
#s-workout.paused .w-bg::after{animation-play-state:paused}
.w-flash{position:absolute;inset:0;z-index:8;background:#fff;opacity:0;pointer-events:none}
.w-flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.6}100%{opacity:0}}
.w-top{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 0}
@media (orientation:portrait){
  .w-counters{order:3;width:100%}
  .w-counters .pill{flex:1;justify-content:center}
  .w-counters .pill b{font-size:clamp(26px,8vmin,72px)}
  .w-counters .pill small{font-size:clamp(11px,2.8vmin,24px)}
  .w-brand{width:100%;justify-content:space-between}
  .w-brand .w-logo{height:clamp(42px,11.5vmin,84px);padding:7px 14px}
}
.w-brand{display:flex;align-items:center;gap:10px;min-width:0}
.w-logo{height:clamp(34px,7vmin,64px);min-width:0;background:rgba(12,12,18,.88);border-radius:14px;padding:6px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.w-logo svg{height:100%;width:auto;display:block}
.w-wm{position:absolute;left:50%;top:50%;width:min(150vmin,130vmax);transform:translate(-50%,-50%) rotate(-24deg);color:var(--fg);opacity:.12;pointer-events:none}
.w-wm svg{width:100%;height:auto;display:block}
.w-fs{width:clamp(36px,7vmin,48px);height:clamp(36px,7vmin,48px);border-radius:12px;background:var(--glass);border:1px solid var(--glassb);display:grid;place-items:center;font-size:clamp(18px,3.6vmin,26px);flex:none}
.w-counters{display:flex;gap:8px;flex:none}
.pill{background:var(--glass);border:1px solid var(--glassb);border-radius:16px;padding:6px 12px;display:flex;align-items:baseline;gap:8px}
.pill small{font-size:clamp(10px,2.2vmin,20px);font-weight:900;letter-spacing:.12em;opacity:.85}
.pill b{font-size:clamp(20px,5.6vmin,58px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.w-main{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 16px 8px;gap:10px;transition:opacity .2s}
.w-left{flex:0 0 50%;min-height:0;display:flex;flex-direction:column}
.w-phase{text-align:center;font-weight:900;letter-spacing:.2em;font-size:clamp(20px,6.4vmin,80px);line-height:1;padding-left:.2em}
.w-phase.anim{animation:slidein .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes slidein{from{transform:translateY(-30%) scale(.9);opacity:0}}
.w-timebox{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring circle{fill:none;stroke:var(--fg);stroke-width:13}
.ring .trk{opacity:.2}
.ring .arc{stroke-linecap:round;stroke-dasharray:565.49 565.49;filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
.w-timein{position:relative;display:flex;align-items:center;justify-content:center}
#w-time{width:100%;text-align:center;font-weight:900;line-height:.8;font-variant-numeric:tabular-nums;letter-spacing:-.05em;white-space:nowrap;padding-right:.05em;text-shadow:0 10px 40px rgba(0,0,0,.18)}
.w-left,.w-right,.w-exwrap,.w-nextwrap,.fitbox{min-width:0}
.w-right{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.w-exwrap{flex:1.6;min-height:0;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--glassb);border-radius:24px;padding:8px 14px 12px}
.w-nextwrap{flex:1;min-height:0;display:flex;flex-direction:column;border:2px dashed var(--glassb);border-radius:24px;padding:6px 14px 10px}
.w-lbl{font-size:clamp(11px,2.5vmin,24px);font-weight:900;letter-spacing:.26em;opacity:.85;text-align:center;padding-left:.26em}
.fitbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fit{width:100%;text-align:center;font-weight:900;line-height:1;text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:normal;word-break:normal;hyphens:none}
#w-ex{text-shadow:0 6px 30px rgba(0,0,0,.15)}
#s-workout.noex .w-right{display:none}
#s-workout.noex .w-left{flex:1}
#s-workout.noex .w-phase{font-size:clamp(30px,10vmin,140px)}
#s-workout.nonext .w-nextwrap{display:none}
@media (orientation:landscape){
  .w-main{flex-direction:row;gap:16px}
  .w-left{flex:0 0 46%}
}
.w-ctrl{position:relative;z-index:2;display:flex;justify-content:center;align-items:flex-start;gap:clamp(4px,2.2vw,22px);padding:10px 8px 12px;flex:none}
.cb{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.cb .c{width:clamp(46px,12.5vmin,68px);height:clamp(46px,12.5vmin,68px);border-radius:50%;background:var(--glass);border:1px solid var(--glassb);display:grid;place-items:center;font-size:clamp(22px,6vmin,32px);transition:transform .1s}
.cb:active .c{transform:scale(.9)}
.cb em{font-style:normal;font-size:clamp(8px,2vmin,12px);font-weight:900;letter-spacing:.06em;white-space:nowrap;opacity:.9}
.cb.play .c{width:clamp(64px,18vmin,96px);height:clamp(64px,18vmin,96px);background:var(--fg);color:var(--p1);border:0;font-size:clamp(32px,9vmin,50px);box-shadow:0 10px 30px rgba(0,0,0,.2)}
@media (max-height:500px){
  .cb em{display:none}
  .w-ctrl{padding:6px 8px 8px}
  .cb .c{width:44px;height:44px;font-size:22px}
  .cb.play .c{width:58px;height:58px;font-size:30px}
  .w-top{padding-top:8px}
}
#s-workout.paused .w-phase{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.w-count{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;padding-bottom:10vh}
#s-workout.counting .w-count{display:flex}
.cring{position:relative;width:min(60vh,86vw);height:min(60vh,86vw);width:min(60dvh,86vw);height:min(60dvh,86vw);display:flex;align-items:center;justify-content:center}
.cring .ring circle{stroke-width:11}
.cring.pulse{animation:pulse .95s ease-out both}
@keyframes pulse{0%{transform:scale(1.12)}30%{transform:scale(1)}}
#w-carc.sweep{animation:sweep 1s linear both}
@keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-565.49}}
#s-workout.paused .cring,#s-workout.paused #w-carc,#s-workout.paused #w-cnum{animation-play-state:paused}
@media (orientation:landscape) and (max-height:500px){ .w-count{padding-bottom:6vh} }
#s-workout.counting .w-main{opacity:.1}
#w-cnum{font-size:min(40vh,58vw);font-size:min(40dvh,58vw);font-weight:900;line-height:.8;font-variant-numeric:tabular-nums;text-shadow:0 20px 60px rgba(0,0,0,.25)}
#w-cnum.pop{animation:pop .95s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes pop{0%{transform:scale(1.8);opacity:0}22%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.86);opacity:.4}}
#w-cnext{font-size:clamp(24px,9vmin,96px);font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin-top:3vmin;text-align:center;padding:0 16px;max-width:100%;line-height:1.05}

/* ---------- FINE SESSIONE ---------- */
#s-finish{background:linear-gradient(160deg,#9b30ff,#4a00e0 70%);color:#fff;overflow:hidden}
#s-finish .scroll{display:flex}
.fin{margin:auto;width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:calc(env(safe-area-inset-top) + 24px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 20px)}
.fin-info{display:flex;flex-direction:column;align-items:center;gap:10px}
.trophy{font-size:min(24vmin,150px);color:#ffd54a;filter:drop-shadow(0 12px 30px rgba(0,0,0,.3));animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-6%) rotate(-4deg)}}
.fin-s{font-size:clamp(16px,4vmin,26px);font-weight:900;letter-spacing:.3em;opacity:.85;padding-left:.3em}
.fin-t{font-size:clamp(34px,10vmin,96px);font-weight:900;line-height:.95;letter-spacing:-.01em}
.fin-d{font-size:clamp(14px,3.4vmin,20px);font-weight:800;opacity:.85;letter-spacing:.06em}
.fin-btns{display:flex;flex-direction:column;gap:12px;width:min(520px,100%)}
.fin-btns .btn{width:100%;min-height:64px;font-size:18px}
.fin .btn-primary{background:#fff;color:#4a00e0;box-shadow:0 14px 40px -12px rgba(0,0,0,.5)}
.fin .btn-ghost{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
@media (orientation:landscape) and (max-height:560px){
  .fin{flex-direction:row;gap:28px}
  .fin-info{flex:1}
  .fin-btns{flex:1}
}
#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

/* ---------- MODALE / TOAST ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--panel2);border:1px solid var(--line);border-radius:26px;padding:24px;width:min(460px,100%);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mbox h3{font-size:22px;font-weight:900;letter-spacing:.04em;margin-bottom:8px}
.mbox p{color:#c9c9da;line-height:1.45;margin-bottom:20px}
.mbox .btn-row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,30px);z-index:60;background:#fff;color:#111;font-weight:800;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){
  .home-bg i,.w-bg::after,.trophy{animation:none}
}
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="s-home">
  <div class="home-bg"><i></i><i></i><i></i></div>
  <div class="scroll">
    <div class="wrap">
      <div class="home-head">
        <div class="brand">
          <div class="logo-big" data-logo="color"></div>
          <div class="tag">TABATA TIMER</div>
        </div>
        <button class="icon-btn" id="b-settings" aria-label="Impostazioni suoni"><svg class="i" viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></button>
      </div>
      <div class="cards" id="cards"></div>
      <div class="foot" id="storage-note"></div>
    </div>
  </div>
</section>

<!-- MODIFICA SESSIONE -->
<section class="screen" id="s-edit">
  <div class="scroll">
    <div class="page-head">
      <button class="icon-btn" data-back aria-label="Indietro"><svg class="i" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <h1 id="e-title">SESSIONE 1</h1>
    </div>
    <div class="page">
      <div class="sec-title">STRUTTURA</div>
      <div class="grid2" id="e-fields"></div>
      <div class="sec-title">ESERCIZI (FACOLTATIVI) · UNO PER RIGA = UNO PER ROUND</div>
      <textarea id="e-ex" spellcheck="false" autocapitalize="characters" autocomplete="off" placeholder="BURPEES&#10;SQUAT JUMP&#10;PUSH UP&#10;MOUNTAIN CLIMBER&#10;JUMPING JACK&#10;AFFONDI&#10;PLANK JACK&#10;HIGH KNEES"></textarea>
      <div class="hint" id="e-hint"></div>
    </div>
  </div>
  <div class="bottom-bar">
    <div class="tot">DURATA TOTALE<b id="e-total">0:00</b></div>
    <button class="btn btn-primary" id="e-start"><svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>AVVIA</button>
  </div>
</section>

<!-- IMPOSTAZIONI -->
<section class="screen" id="s-settings">
  <div class="scroll">
    <div class="page-head">
      <button class="icon-btn" data-back aria-label="Indietro"><svg class="i" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <h1>IMPOSTAZIONI</h1>
    </div>
    <div class="page">
      <div class="sec-title">SUONI</div>
      <div class="stack" id="snd-rows"></div>
      <div class="sec-title">VOLUME</div>
      <div class="vol"><svg class="i" viewBox="0 0 24 24" style="font-size:26px"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><input type="range" id="vol" min="0" max="100" step="5"><b id="vol-v">90%</b></div>
      <div class="sec-title">SALVATAGGIO</div>
      <div class="stack">
        <div class="note" id="save-note"></div>
        <button class="btn btn-ghost" id="b-savecopy"><svg class="i" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>SALVA COPIA CON LE MIE IMPOSTAZIONI</button>
        <button class="btn btn-ghost" id="b-reset"><svg class="i" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>RIPRISTINA VALORI INIZIALI</button>
      </div>
      <div class="foot">GIOVABATA · v1.0</div>
    </div>
  </div>
</section>

<!-- ALLENAMENTO -->
<section class="screen" id="s-workout" data-phase="prep">
  <div class="w-bg"><div class="w-wm" data-logo="mono"></div></div>
  <div class="w-top">
    <div class="w-brand">
      <div class="w-logo" data-logo="color"></div>
      <button class="w-fs" id="b-fs" aria-label="Schermo intero"><svg class="i" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    </div>
    <div class="w-counters">
      <div class="pill"><small>ROUND</small><b id="w-round">1/8</b></div>
      <div class="pill"><small>CICLO</small><b id="w-cycle">1/4</b></div>
    </div>
  </div>
  <div class="w-main">
    <div class="w-left">
      <div class="w-phase" id="w-phase">PREPARATI</div>
      <div class="w-timebox" id="w-timebox">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(-90 100 100)"><circle class="trk" cx="100" cy="100" r="90"/><circle class="arc" id="w-arc" cx="100" cy="100" r="90"/></g></svg>
        <div class="w-timein" id="w-timein"><div id="w-time">10</div></div>
      </div>
    </div>
    <div class="w-right">
      <div class="w-exwrap">
        <div class="w-lbl" id="w-exlbl">ESERCIZIO</div>
        <div class="fitbox" id="w-exbox"><div class="fit" id="w-ex"></div></div>
      </div>
      <div class="w-nextwrap">
        <div class="w-lbl">PROSSIMO</div>
        <div class="fitbox" id="w-nextbox"><div class="fit" id="w-next"></div></div>
      </div>
    </div>
  </div>
  <nav class="w-ctrl">
    <button class="cb" id="c-stop" aria-label="Stop"><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></span><em>STOP</em></button>
    <button class="cb" id="c-restart" aria-label="Ricomincia"><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg></span><em>DA CAPO</em></button>
    <button class="cb" id="c-prev" aria-label="Round indietro"><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></span><em>ROUND −</em></button>
    <button class="cb play" id="c-play" aria-label="Play / Pausa"><span class="c" id="c-play-ico"></span><em id="c-play-lbl">PAUSA</em></button>
    <button class="cb" id="c-next" aria-label="Round avanti"><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></span><em>ROUND +</em></button>
    <button class="cb" id="c-skip" aria-label="Salta sessione"><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></span><em>SALTA SESS.</em></button>
  </nav>
  <div class="w-count">
    <div class="cring" id="w-cring">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><g transform="rotate(-90 100 100)"><circle class="trk" cx="100" cy="100" r="90"/><circle class="arc" id="w-carc" cx="100" cy="100" r="90"/></g></svg>
      <div id="w-cnum">3</div>
    </div>
    <div id="w-cnext"></div>
  </div>
  <div class="w-flash" id="w-flash"></div>
</section>

<!-- FINE SESSIONE -->
<section class="screen" id="s-finish">
  <div id="confetti"></div>
  <div class="scroll">
    <div class="fin">
      <div class="fin-info">
        <svg class="i trophy" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
        <div class="fin-s" id="f-sess">SESSIONE 1</div>
        <div class="fin-t" id="f-title">COMPLETATA!</div>
        <div class="fin-d" id="f-desc"></div>
      </div>
      <div class="fin-btns">
        <button class="btn btn-primary" id="f-other"></button>
        <button class="btn btn-ghost" id="f-repeat"></button>
        <button class="btn btn-ghost" id="f-home"><svg class="i" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>HOME</button>
      </div>
    </div>
  </div>
</section>

function audio() {

    AC = new C();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 10; comp.attack.value = 0.002; comp.release.value = 0.2;
    const post = AC.createGain(); post.gain.value = 1.35;
    master = AC.createGain(); master.gain.value = state.volume;
    master.connect(comp); comp.connect(post); post.connect(AC.destination);

  }

}
function resumeAudio() {
  if (!AC || AC.state === 'running' || !AC.resume) return;

// inviluppo: attacco, mantenimento, decadimento esponenziale
function envGain(ac, t, a, v, hold, d) {

  g.gain.exponentialRampToValueAtTime(v, t + a);

}

  const g = envGain(ac, t, a, v, hold, d);

}

}

const RING_MODES = [ // [rapporto, ampiezza, decadimento s]
  [1, 1, 2.6], [1.006, .7, 2.4],

// suoni registrati (MP3 in base64 nel tag gb-samples), decodificati una volta per contesto audio
const sampleCache = new WeakMap();
function sampleBuffers(ac) {
  let c = sampleCache.get(ac);
  if (!c) {
    c = { bufs: {}, ready: null };
    const src = window.GB_SAMPLES || {};
    c.ready = Promise.all(Object.keys(src).map(id => new Promise(res => {
      const bin = atob(src[id]), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      try {
        const p = ac.decodeAudioData(arr.buffer, b => { c.bufs[id] = b; res(); }, () => res());
        if (p && p.catch) p.catch(() => res());
      } catch (e) { res(); }
    })));
    sampleCache.set(ac, c);
  }
  return c;
}
function sample(ac, out, t, id, v = 1) {
  const c = sampleBuffers(ac);
  const start = when => {
    const b = c.bufs[id]; if (!b) return;
    const s = ac.createBufferSource(), g = ac.createGain();
    s.buffer = b; g.gain.value = v; s.connect(g); g.connect(out); s.start(when);
  };
  if (c.bufs[id]) start(t);
  else c.ready.then(() => start(Math.max(t, ac.currentTime)));
}

let wakeLock = null, wakeWanted = false, fbVideo = null, fbTimer = 0;
async function keepAwake(on) {
  wakeWanted = on;
  if (on) {
    if ('wakeLock' in navigator) {
      try {
        if (!wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
        return;
      } catch (e) {}
    }
    fallbackWake(true);
  } else {
    if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; }
    fallbackWake(false);
  }
}
// riserva: un video muto invisibile in riproduzione impedisce lo spegnimento su alcuni dispositivi
function fallbackWake(on) {
  try {
    if (on) {
      if (!fbVideo) {
        const c = document.createElement('canvas'); c.width = c.height = 2;
        if (!c.captureStream) return;
        const g = c.getContext('2d'); let k = 0;
        const draw = () => { g.fillStyle = (k++ % 2) ? '#000' : '#020202'; g.fillRect(0, 0, 2, 2); };
        draw();
        fbVideo = document.createElement('video');
        fbVideo.muted = true; fbVideo.setAttribute('muted', ''); fbVideo.setAttribute('playsinline', '');
        fbVideo.style.cssText = 'position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
        fbVideo.srcObject = c.captureStream(2);
        document.body.appendChild(fbVideo);
        fbTimer = setInterval(draw, 500);
      }
      fbVideo.play().catch(() => {});
    } else if (fbVideo) fbVideo.pause();
  } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeWanted) keepAwake(true);
});

}

  $('#e-total').textContent = fmt(totalSec(s));
  if (!n) { h.className = 'hint'; h.textContent = 'Nessun esercizio: durante l’allenamento vedrai solo LAVORO / RIPOSO / RECUPERO.'; }
  else if (n === r) { h.className = 'hint ok'; h.textContent = `✓ ${n} esercizi per ${r} round. Si ripetono uguali in ogni ciclo.`; }
  else if (n < r) { h.className = 'hint warn'; h.textContent = `${n} esercizi per ${r} round: finita la lista si ricomincia dal primo.`; }
  else { h.className = 'hint warn'; h.textContent = `${n} esercizi ma solo ${r} round: gli ultimi ${n - r} non verranno usati.`; }
}
// pulsanti − / + con ripetizione tenendo premuto
let holdT = 0, holdI = 0;
const stopHold = () => { clearTimeout(holdT); clearInterval(holdI); };
$('#e-fields').addEventListener('pointerdown', e => {
  const b = e.target.closest('.step'); if (!b) return;
  e.preventDefault();
  const k = b.dataset.k, d = +b.dataset.d;
  setField(k, state.sessions[editIdx][k] + d);
  stopHold();
  const t0 = now();
  holdT = setTimeout(() => {
    holdI = setInterval(() => {
      const mult = now() - t0 > 2000 ? 5 : 1;
      setField(k, state.sessions[editIdx][k] + d * mult);
    }, 75);
  }, 420);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('#e-fields').addEventListener(ev, stopHold));
$('#e-fields').addEventListener('change', e => { if (e.target.matches('.num')) setField(e.target.dataset.k, e.target.value); });
$('#e-fields').addEventListener('input', e => {
  if (!e.target.matches('.num')) return;
  const k = e.target.dataset.k, [, , , a, b] = fieldDef(k), v = parseInt(e.target.value, 10);
  if (Number.isFinite(v) && v >= a && v <= b) { state.sessions[editIdx][k] = v; save(); updateEditInfo(); }
});
$('#e-ex').addEventListener('input', e => { state.sessions[editIdx].exercises = e.target.value; save(); updateEditInfo(); });
$('#e-start').addEventListener('click', () => startSession(editIdx));

/* ================= IMPOSTAZIONI ================= */
function renderSettings() {
  $('#snd-rows').innerHTML = EVENTS.map(([k, l]) => `
    <div class="srow">
      <div class="lbl">${l}</div>
      <select data-ev="${k}" aria-label="${l}">${SOUND_LIST.map(([id, n]) => `<option value="${id}"${state.sounds[k] === id ? ' selected' : ''}>${n}</option>`).join('')}</select>
      <button class="step" data-test="${k}" aria-label="Ascolta">${ICON.play}</button>
    </div>`).join('');
  $('#vol').value = Math.round(state.volume * 100);
  $('#vol-v').textContent = Math.round(state.volume * 100) + '%';
  $('#save-note').innerHTML = canStore
    ? '<b>Salvataggio automatico attivo.</b> Sessioni, esercizi e suoni restano su questo dispositivo. Con <b>SALVA COPIA</b> crei un nuovo file giovabata.html che contiene già le tue impostazioni: utile come backup o per passarlo su un altro telefono.'
    : '<b>⚠ Questo browser non permette il salvataggio automatico</b> quando il file è aperto dalla memoria del telefono. Dopo aver impostato sessioni ed esercizi premi <b>SALVA COPIA</b>: otterrai un nuovo file giovabata.html che si apre già con le tue impostazioni. Usa quello al posto del vecchio.';
}
$('#b-settings').addEventListener('click', () => { unlockAudio(); renderSettings(); go('settings'); });
$('#snd-rows').addEventListener('change', e => {
  const sel = e.target.closest('select[data-ev]'); if (!sel) return;
  state.sounds[sel.dataset.ev] = sel.value; save(); unlockAudio(); play(sel.value);
});
$('#snd-rows').addEventListener('click', e => {
  const b = e.target.closest('[data-test]'); if (!b) return;
  unlockAudio(); play(state.sounds[b.dataset.test]);
});
$('#vol').addEventListener('input', e => {
  state.volume = e.target.value / 100; $('#vol-v').textContent = e.target.value + '%';
  if (master) master.gain.value = state.volume; save();
});
$('#vol').addEventListener('change', () => { unlockAudio(); play('beep'); });
$('#b-reset').addEventListener('click', async () => {
  if (!await confirmBox('Ripristinare?', 'Tutte e due le sessioni, gli esercizi e i suoni torneranno ai valori iniziali.', 'RIPRISTINA')) return;
  state = sanitize(null); save(); if (master) master.gain.value = state.volume; renderSettings(); toast('Valori iniziali ripristinati');
});
$('#b-savecopy').addEventListener('click', async () => {
  const json = JSON.stringify(state).replace(/</g, '\\u003c');
  const html = SOURCE_HTML.replace(/(<script id="gb-embedded" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
  const name = 'giovabata.html';
  const file = (() => { try { return new File([html], name, { type: 'text/html' }); } catch (e) { return null; } })();
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'GIOVABATA' }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  toast('File giovabata.html creato (cartella Download)');
});

/* ================= ALLENAMENTO ================= */
const W = $('#s-workout');
const el = { time: $('#w-time'), timebox: $('#w-timebox'), phase: $('#w-phase'), round: $('#w-round'), cycle: $('#w-cycle'),
  exlbl: $('#w-exlbl'), ex: $('#w-ex'), exbox: $('#w-exbox'), next: $('#w-next'), nextbox: $('#w-nextbox'),
  arc: $('#w-arc'), timein: $('#w-timein'), cring: $('#w-cring'), carc: $('#w-carc'), cnum: $('#w-cnum'), cnext: $('#w-cnext'), flash: $('#w-flash') };
let run = null, rafId = 0, loopI = 0;
const shown = {};

function startSession(i) {
  unlockAudio();
  const s = clone(state.sessions[i]);
  const segs = buildSegs(s);
  run = { idx: i, s, segs, i: 0, playing: true, segStart: now(), pausedAt: 0, lastSec: 0, done: false, hasEx: exList(s).length > 0 };
  for (const k in shown) delete shown[k];
  W.classList.toggle('noex', !run.hasEx);
  go('workout');
  keepAwake(true);
  enterSeg(true);
  updPlayUI();
  loop();
}
function elapsed() { return (run.playing ? now() : run.pausedAt) - run.segStart; }

function enterSeg(sound) {
  const seg = run.segs[run.i];
  run.lastSec = Math.ceil(seg.dur);
  W.classList.remove('counting');
  W.dataset.phase = seg.type;
  el.flash.classList.remove('go'); void el.flash.offsetWidth; el.flash.classList.add('go');
  el.phase.classList.remove('anim'); void el.phase.offsetWidth; el.phase.classList.add('anim');
  if (sound && run.playing) play(state.sounds[{ work: 'work', rest: 'rest', recovery: 'recovery' }[seg.type]]);
  render();
}
function countdown(sec) {
  play(state.sounds.count);
  W.classList.add('counting');
  el.cnum.textContent = sec;
  for (const [n, c] of [[el.cnum, 'pop'], [el.cring, 'pulse'], [el.carc, 'sweep']]) { n.classList.remove(c); void n.getBoundingClientRect(); n.classList.add(c); }
  const nx = run.segs[run.i + 1];
  el.cnext.textContent = nx ? '→ ' + (nx.type === 'work' ? (nx.ex || 'LAVORO') : PHASE[nx.type]) : '→ FINE';
}
function tick() {
  if (!run || run.done) return;
  if (run.playing) {
    let seg = run.segs[run.i], e = now() - run.segStart, advanced = false;
    while (e >= seg.dur * 1000) {
      run.segStart += seg.dur * 1000;
      run.i++;
      if (run.i >= run.segs.length) { finish(true); return; }
      seg = run.segs[run.i]; e = now() - run.segStart; advanced = true;
    }
    if (advanced) enterSeg(true);
    const sec = Math.ceil((seg.dur * 1000 - e) / 1000 - 1e-9);
    if (sec < run.lastSec) { run.lastSec = sec; if (sec >= 1 && sec <= 3) countdown(sec); }
  }
  render();
}
function setTxt(key, node, txt) {
  if (shown[key] === txt) return false;
  shown[key] = txt; node.textContent = txt; return true;
}
function render() {
  const seg = run.segs[run.i], e = Math.max(0, elapsed()), durMs = seg.dur * 1000;
  const sec = Math.max(0, Math.ceil((durMs - e) / 1000 - 1e-9));
  // anello: la parte rimasta va dalla lancetta fino a ore 12, in senso orario
  el.arc.style.strokeDashoffset = (-Math.min(1, e / durMs) * 565.49).toFixed(2);
  let refitNeeded = false;
  if (setTxt('time', el.time, String(sec)) && String(sec).length !== shown.timeLen) { shown.timeLen = String(sec).length; refitNeeded = true; }
  setTxt('round', el.round, `${seg.round}/${run.s.rounds}`);
  setTxt('cycle', el.cycle, `${seg.cycle}/${run.s.cycles}`);
  setTxt('phase', el.phase, run.playing ? PHASE[seg.type] : 'IN PAUSA');
  if (run.hasEx) {
    const nw = seg.nw >= 0 ? run.segs[seg.nw] : null;
    if (seg.type === 'work') {
      setTxt('exlbl', el.exlbl, 'ESERCIZIO');
      refitNeeded = setTxt('ex', el.ex, seg.ex) || refitNeeded;
      refitNeeded = setTxt('next', el.next, nw ? nw.ex : 'FINE SESSIONE') || refitNeeded;
      if (W.classList.contains('nonext')) { W.classList.remove('nonext'); refitNeeded = true; }
    } else {
      setTxt('exlbl', el.exlbl, 'PROSSIMO');
      refitNeeded = setTxt('ex', el.ex, nw ? nw.ex : '') || refitNeeded;
      if (!W.classList.contains('nonext')) { W.classList.add('nonext'); refitNeeded = true; }
    }
  }
  if (refitNeeded) refit(true);
}

/* adatta la dimensione del testo allo spazio disponibile (ricerca binaria) */
function fitText(node, box, maxPx, minPx) {
  const bw = box.clientWidth, bh = box.clientHeight;
  if (!bw || !bh) return;
  let lo = minPx, hi = Math.max(minPx, maxPx), best = minPx;
  for (let k = 0; k < 14; k++) {
    const mid = (lo + hi) / 2;
    node.style.fontSize = mid + 'px';
    if (node.scrollWidth <= node.clientWidth + 1 && node.scrollHeight <= bh + 1) { best = mid; lo = mid; } else hi = mid;
  }
  node.style.fontSize = Math.floor(best) + 'px';
}
function refit() {
  if (cur !== 'workout' || !run) return;
  // i secondi stanno in un rettangolo inscritto nell'anello
  const S = Math.min(el.timebox.clientWidth, el.timebox.clientHeight);
  el.timein.style.width = Math.floor(S * 0.7) + 'px';
  el.timein.style.height = Math.floor(S * 0.5) + 'px';
  fitText(el.time, el.timein, S * 0.5 / 0.8, 20);
  if (run.hasEx) {
    fitText(el.ex, el.exbox, Math.min(el.exbox.clientHeight, 260), 14);
    if (!W.classList.contains('nonext')) fitText(el.next, el.nextbox, Math.min(el.nextbox.clientHeight, 150), 12);
  }
}
let rzT = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rzT); rzT = requestAnimationFrame(() => refit(true)); });

function loop() {
  cancelAnimationFrame(rafId);
  const f = () => { tick(); if (run && !run.done && cur === 'workout') rafId = requestAnimationFrame(f); };
  rafId = requestAnimationFrame(f);
  // di riserva se requestAnimationFrame viene rallentato
  if (!loopI) loopI = setInterval(() => { if (run && !run.done && cur === 'workout') tick(); }, 250);
}

function updPlayUI() {
  const p = run && run.playing;
  W.classList.toggle('paused', !!run && !p);
  $('#c-play-ico').innerHTML = p ? ICON.pause : ICON.play;
  $('#c-play-lbl').textContent = p ? 'PAUSA' : 'PLAY';
}
function togglePlay() {
  if (!run || run.done) return;
  unlockAudio();
  if (run.playing) { run.playing = false; run.pausedAt = now(); }
  else { run.segStart += now() - run.pausedAt; run.playing = true; }
  updPlayUI(); render();
}
function jump(i) {
  run.i = Math.max(0, Math.min(run.segs.length - 1, i));
  run.segStart = now(); run.pausedAt = run.segStart;
  enterSeg(true);
}
function nextRound() {
  if (!run || run.done) return;
  const j = run.segs.findIndex((x, k) => k > run.i && x.type === 'work');
  if (j < 0) finish(false); else jump(j);
}
function prevRound() {
  if (!run || run.done) return;
  const i = run.i, seg = run.segs[i];
  if (seg.type === 'work' && elapsed() > 2000) return jump(i);
  if (seg.type === 'rest') return jump(i - 1);
  let j = -1;
  for (let k = i - 1; k >= 0; k--) if (run.segs[k].type === 'work') { j = k; break; }
  jump(j >= 0 ? j : 0);
}
async function withPause(title, msg, ok) {
  const was = run.playing;
  if (was) togglePlay();
  const yes = await confirmBox(title, msg, ok);
  if (!yes && was && run && !run.done) togglePlay();
  return yes;
}
async function askStop() {
  if (!run || run.done) return;
  if (await withPause('Fermare l’allenamento?', 'Il timer si ferma e torni alla schermata iniziale.', 'STOP')) { run = null; go('home'); }
}
$('#c-play').addEventListener('click', togglePlay);
$('#c-next').addEventListener('click', nextRound);
$('#c-prev').addEventListener('click', prevRound);
$('#c-stop').addEventListener('click', askStop);
$('#c-restart').addEventListener('click', async () => {
  if (!run || run.done) return;
  if (await withPause('Ricominciare da capo?', `La SESSIONE ${run.idx + 1} riparte dall’inizio.`, 'DA CAPO')) startSession(run.idx);
});
$('#c-skip').addEventListener('click', async () => {
  if (!run || run.done) return;
  if (await withPause('Saltare la sessione?', `La SESSIONE ${run.idx + 1} termina qui e passi alla schermata finale.`, 'SALTA')) finish(false);
});

const fsRoot = document.documentElement;
if (!(fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen)) $('#b-fs').style.display = 'none';
$('#b-fs').addEventListener('click', () => {
  const d = document;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const p = (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
});

document.addEventListener('keydown', e => {
  if (cur !== 'workout' || $('#modal').classList.contains('on')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') nextRound();
  else if (e.key === 'ArrowLeft') prevRound();
  else if (e.key === 'Escape') askStop();
});

/* ================= FINE SESSIONE ================= */
function finish(completed) {
  run.done = true; run.playing = false;
  cancelAnimationFrame(rafId);
  W.classList.remove('counting', 'paused');
  const i = run.idx, o = 1 - i, s = run.s;
  if (completed) play(state.sounds.end);
  $('#f-sess').textContent = 'SESSIONE ' + (i + 1);
  $('#f-title').textContent = completed ? 'COMPLETATA!' : 'TERMINATA';
  $('#f-desc').textContent = `${s.rounds} ROUND × ${s.cycles} CICLI · ${fmt(totalSec(s))}`;
  $('#f-other').innerHTML = `${ICON.play}AVVIA SESSIONE ${o + 1}`;
  $('#f-repeat').innerHTML = `${ICON.repeat}RIPETI SESSIONE ${i + 1}`;
  go('finish');
  keepAwake(true);
  if (completed) confetti();
}
function confetti() {
  const box = $('#confetti'), cols = ['#ffd000', '#ff3d2e', '#14d96b', '#2a62ff', '#fff', '#ff2d95'];
  box.innerHTML = Array.from({ length: 70 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${cols[Math.random() * cols.length | 0]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join('');
}
$('#f-other').addEventListener('click', () => startSession(1 - run.idx));
$('#f-repeat').addEventListener('click', () => startSession(run.idx));
$('#f-home').addEventListener('click', () => { run = null; go('home'); });

/* ================= AVVIO ================= */
let state = loadState();
renderHome();

// accesso per i test automatici
window.__gb = { get state() { return state; }, get run() { return run; }, buildSegs, totalSec, SND, SOUND_LIST,
  startSession, tick, jump, nextRound, prevRound, togglePlay,
  ff(ms) { if (run && !run.done) { run.segStart -= ms; tick(); } } };
})();
</script>
